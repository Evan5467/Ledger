name: Create signing key (run once)

# Creates the Android signing key INSIDE GitHub and stores it only as encrypted
# repository secrets. The key is never written to the repo, never printed, and
# never uploaded as a downloadable file.
#
# One-time setup: add a repository secret named ADMIN_TOKEN (a fine-grained
# personal access token for THIS repo with "Secrets: Read and write"), run this
# workflow, then delete ADMIN_TOKEN and the token itself. See README.

on:
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Type REPLACE to overwrite an existing key (apps signed with the old key can no longer be updated)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create key and store it as secrets
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          REPLACE: ${{ inputs.replace_existing }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ADMIN_TOKEN secret is missing. Follow the README step 'Create the signing key'."; exit 1
          fi
          if gh secret list --repo "$REPO" | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            if [ "$REPLACE" != "REPLACE" ]; then
              echo "::error::A signing key already exists. Replacing it would stop updates of an installed app. Nothing was changed."; exit 1
            fi
          fi
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          KS="$RUNNER_TEMP/ledger-upload.p12"
          umask 077
          keytool -genkeypair -storetype PKCS12 -keystore "$KS" -alias ledger \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Ledger, O=Ledger, C=IN" >/dev/null 2>&1
          B64="$(base64 -w0 "$KS")"
          echo "::add-mask::$B64"
          gh secret set ANDROID_KEYSTORE_BASE64   --repo "$REPO" --body "$B64"
          gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$REPO" --body "$PASS"
          gh secret set ANDROID_KEY_ALIAS         --repo "$REPO" --body "ledger"
          shred -u "$KS" 2>/dev/null || rm -f "$KS"
          echo "Signing key stored as encrypted secrets. Now delete the ADMIN_TOKEN secret and the token."
