name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Install dependencies (no install scripts)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Harden manifest and set version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          grep -q 'android:allowBackup="false"' "$M" || { echo "::error::allowBackup patch failed"; exit 1; }
          if ! grep -q usesCleartextTraffic "$M"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="false"/' "$M"
          fi
          grep -q 'usesCleartextTraffic="false"' "$M" || { echo "::error::cleartext patch failed"; exit 1; }
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$G"

      - name: App icon
        run: |
          R=android/app/src/main/res
          rm -f $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $R/mipmap-$d
            convert www/icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
          done

      - name: Build release (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign with the key stored in repository secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ] || [ -z "${KS_PASS:-}" ]; then
            echo "::error::No signing key found. Run 'Create signing key (run once)' first (see README)."; exit 1
          fi
          KS="$RUNNER_TEMP/ledger-upload.p12"
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "${KS_ALIAS:-ledger}" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out Ledger.apk "$RUNNER_TEMP/aligned.apk"
          shred -u "$KS" 2>/dev/null || rm -f "$KS"
          "$BT/apksigner" verify --print-certs Ledger.apk | grep -i "SHA-256" || true
          sha256sum Ledger.apk > Ledger.apk.sha256

      - name: Remove key material (always)
        if: always()
        run: rm -f "$RUNNER_TEMP"/ledger-upload.p12 "$RUNNER_TEMP"/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-apk
          path: |
            Ledger.apk
            Ledger.apk.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Ledger-apk }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Ledger.apk
            Ledger.apk.sha256
